[project]
name = "thedownloader"
version = "1.1.0"
description = "THE Downloader: a personal Spotify + YouTube downloader"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mutagen>=1.48.1",
    "pywebview>=6.2.1",
    "requests>=2.34.2",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
thedownloader = "thedownloader.cli:main"

[project.gui-scripts]
# Starts the app window without a terminal window behind it.
thedownloader-app = "thedownloader.window:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
